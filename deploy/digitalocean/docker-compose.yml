name: supportbench

services:
  supportbench-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${SUPPORTBENCH_POSTGRES_USER}:${SUPPORTBENCH_POSTGRES_PASSWORD}@db:5432/${SUPPORTBENCH_POSTGRES_DB}
      SUPPORTBENCH_DATA_DIR: /app/data
      PORT: 8000
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - quotepilot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  quotepilot:
    external: true
    name: digitalocean_default
